<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sua Loja - Catálogo</title><link rel="stylesheet" href="css/estilo.css"><link rel=stylesheet href=css/catalogo-pro.css></head>
<body class="home catalog-page"><main class="wrapper"><section class="tv">
<header class="topbar">
<img class="logo small brand-logo-dynamic" data-brand-logo src="/assets/default-logo.svg" alt="Logo da loja">
<h1 class="title brand-name" data-brand-name style="font-size:30px">Sua Loja</h1>
<p class="subtitle">Catálogo da loja • toque em uma peça para abrir o provador</p>
<p class="kicker">Escolha seu look ideal</p>
</header>
<section class="hero">
<div class="hero-copy">
  <h2>Seleção da Loja</h2>
  <div class="lux-line"></div>
  <p>Toque em uma peça do carrossel para abrir a experiência em tela cheia</p>
</div>
<img class="mannequin brand-logo-dynamic" data-brand-logo src="/assets/default-logo.svg" alt="" style="opacity:.08">
</section>
<section class="catalog-tools" aria-label="Filtros do catalogo">
<div class="catalog-tools-head"><div><span class="catalog-tools-eyebrow">Categorias</span><strong>Encontre seu look</strong></div><span class="catalog-count" id="catalogCount" aria-live="polite"></span></div>
<div class="catalog-filters" id="catalogFilters" role="group" aria-label="Filtrar por categoria"></div>
</section>
<section class="carousel">
<button class="arrow" onclick="prevCatalog()">‹</button>
<div class="track" id="catalogTrack"></div>
<button class="arrow" onclick="nextCatalog()">›</button>
</section>
<section class="actions">
<button class="btn primary" onclick="ProNavigation.go('index.html')">VITRINE</button>
<button class="btn neutral" onclick="ProNavigation.go('descanso.html')">TELA DE DESCANSO</button>
</section>
</section></main>
<script src="../shared/pro-navigation.js"></script><script src="js/salvar.js"></script><script src="js/estoque.js"></script><script src="js/provador.js"></script><script src="js/provador-controls.js"></script><script src="js/provador-mobile-remote.js"></script>
<script>renderCatalogo();</script><script src="../shared/brand-sync.js"></script>
<script src="js/client-neutral-brand.js"></script>
</body></html>
