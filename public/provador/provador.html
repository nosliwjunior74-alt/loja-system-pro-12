<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sua Loja - Provador</title><link rel="stylesheet" href="css/estilo.css"><link rel="stylesheet" href="css/provador-pro.css"></head>
<body class="home provador-pro"><main class="wrapper"><section class="tv">
<header class="topbar">
  <img class="logo small brand-logo-dynamic" data-brand-logo src="/assets/default-logo.svg" alt="Logo da loja">
  <h1 class="title" id="provadorTitle" data-brand-name>Sua Loja</h1>
</header>
<div class="provador-menu-wrap">
<button id="provadorMenuBtn" class="provador-menu-btn" type="button" aria-expanded="false" aria-controls="provadorMenuPanel">MENU</button>
<div id="provadorMenuPanel" class="provador-menu-panel" hidden>
<button id="voiceBtn" class="provador-voice-btn provador-menu-item" type="button" aria-pressed="false" title="Ativar ou desativar comandos de voz">VOZ OFF</button>
<button id="mobileRemoteBtn" class="provador-mobile-btn provador-menu-item" type="button">CONTROLE CELULAR</button>
<div id="mobileRemotePairing" class="provador-mobile-pairing" hidden>
  <div class="provador-mobile-pairing-title">CONTROLE CELULAR</div>
  <div class="provador-mobile-pairing-text">Abra este link no celular conectado a mesma rede:</div>
  <input id="mobileRemoteLink" class="provador-mobile-pairing-link" type="text" readonly aria-label="Link do controle celular">
  <button id="mobileRemoteCopyBtn" class="provador-mobile-pairing-copy" type="button">COPIAR LINK</button>
  <div id="mobileRemoteQr" class="provador-mobile-pairing-qr" hidden></div>
</div>
<button id="backToDescanso" class="provador-back provador-menu-item" type="button" onclick="ProNavigation.go('descanso.html')">&larr; Descanso</button>
</div>
</div>
<section class="camera-area">
<div class="badge" id="provadorBadge">Look</div>
<div class="controls-mini"><button id="trackingBtn" onclick="CameraModule.toggleTracking()">Tracking ligado</button></div>
<video id="video" class="live-video" autoplay playsinline muted></video>
<canvas id="poseCanvas" class="overlay-canvas"></canvas>
<div class="hint" id="cameraTip">Abrindo câmera...</div>
</section>
<section id="looksPanel" class="carousel" style="display:none;">
<button class="arrow" onclick="prevProvador()">‹</button>
<div class="track" id="provadorTrack"></div>
<button class="arrow" onclick="nextProvador()">›</button>
</section>
  <button id="btnLooks" class="btn-looks" onclick="toggleLooks()">
👕 LOOKS
</button>
<section class="actions">
<button class="btn primary" onclick="fotoLook()">FOTO DO LOOK</button>
<button class="btn secondary" onclick="enviarWhats()">ENVIAR WHATSAPP</button>
<button class="btn neutral" onclick="ProNavigation.go('catalogo.html')">TROCAR LOOK</button>
<div class="track-note">O visual e o formato do aplicativo foram mantidos. O tracking automático precisa de internet para carregar o MediaPipe.</div>
</section>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="../shared/pro-navigation.js"></script><script src="js/salvar.js"></script><script src="js/estoque.js"></script><script src="js/camera.js"></script><script src="js/whatsapp.js"></script><script src="js/provador.js"></script>
<script src="js/provador-controls.js"></script><script src="js/provador-mobile-remote.js"></script><script src="js/provador-remote.js"></script><script src="js/provador-voice.js"></script><script src="js/provador-ui.js"></script><script>initProvador().then(()=>window.ProvadorControls?.runPending?.()).catch(error=>console.error('Falha ao iniciar Provador:',error));</script><script src="../shared/brand-sync.js"></script>
 <script>
function toggleLooks() {
    const painel = document.getElementById('looksPanel');

    if (
        painel.style.display === 'none' ||
        painel.style.display === ''
    ) {
        painel.style.display = 'grid';
    } else {
        painel.style.display = 'none';
    }
}
</script>
<script src="js/client-neutral-brand.js"></script>
</body></html>
