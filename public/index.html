<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Multi-Loja</title>

  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/chatbot.css">
</head>

<body>

<button
  class="mobile-menu-toggle"
  id="mobileMenuBtn"
  type="button"
  aria-label="Abrir menu"
  aria-expanded="false">
  <span class="mobile-menu-icon">☰</span>
  <span>Menu</span>
</button>

<div
  class="mobile-menu-overlay"
  id="mobileMenuOverlay">
</div>

<div class="shell">

  <aside class="sidebar">

    <div class="brand">
      <img
        src="assets/default-logo.svg"
        alt="Logo da loja"
        class="brand-logo"
        id="brandLogo"
      >

      <div class="brand-copy">
        <span class="brand-kicker" id="brandKicker">PAINEL MESTRE &bull; PRODUTOR</span>
        <h1 id="brandName">Loja Mestre</h1>
        <p id="brandSub">Central de administracao do produtor</p>
      </div>
    </div>


    <nav class="menu" aria-label="Menu principal">

      <div class="menu-group">

        <span class="menu-label">Operação da loja</span>

        <button
          class="menu-btn"
          data-url="provador/index.html"
          type="button">
          <span class="menu-icon">&#128087;</span>
          Vitrine / Provador
        </button>

        <button
          class="menu-btn"
          data-url="provador/admin.html"
          type="button">
          <span class="menu-icon">&#128230;</span>
          Painel da Loja
        </button>

        <button
          class="menu-btn"
          data-url="configuracoes.html"
          type="button">
          <span class="menu-icon">&#127912;</span>
          Personalizar Loja
        </button>

      </div>


      <div class="menu-group">

        <span class="menu-label">Conteúdo e exibição</span>

        <button
          class="menu-btn"
          data-url="remover_fundo/index.html"
          type="button">
          <span class="menu-icon">&#128444;</span>
          PNG sem Fundo
        </button>

        <button
          class="menu-btn"
          data-url="display_pro/index.html"
          type="button">
          <span class="menu-icon">&#128241;</span>
          Display Pro System
        </button>

        <button
          class="menu-btn"
          data-url="display_pro/admin.html"
          type="button">
          <span class="menu-icon">&#9881;</span>
          Admin Display Pro
        </button>

      </div>


      <div class="menu-group">

        <span class="menu-label">Administração</span>

        <button
          class="menu-btn active"
          data-url="lojas_master.html"
          type="button">
          <span class="menu-icon">&#127970;</span>
          Painel Mestre das Lojas
        </button>

        <button
          class="menu-btn"
          data-url="configuracao-cobranca.html"
          type="button">
          <span class="menu-icon">&#128179;</span>
          Cobrança
        </button>

        <button
          class="menu-btn"
          data-url="financeiro.html"
          type="button">
          <span class="menu-icon">&#128202;</span>
          Financeiro
        </button>

        <button
          class="menu-btn"
          data-url="seguranca.html"
          type="button">
          <span class="menu-icon">&#128274;</span>
          Segurança
        </button>

      </div>


      <div class="menu-group">

        <span class="menu-label">Suporte</span>

        <button
          class="menu-btn"
          data-url="manual/manual.html"
          type="button">
          <span class="menu-icon">&#128214;</span>
          Manual
        </button>

      </div>

    </nav>


    <div class="sidebar-tools">

      <button
        class="utility-btn"
        type="button"
        onclick="fazerBackup()">
        <span class="menu-icon">&#128190;</span>
        Backup agora
      </button>

      <button
        class="utility-btn"
        type="button"
        onclick="listarBackups()">
        <span class="menu-icon">&#128194;</span>
        Ver backups
      </button>

      <div id="listaBackups" class="backup-list"></div>

    </div>


    <div class="actions">

      <button
        class="action-btn"
        id="logoutAdminBtn"
        type="button">
        <span class="menu-icon">&#10140;</span>
        Sair
      </button>

    </div>

  </aside>


  <main class="main-area">

    <header class="topbar">

      <div>
        <strong id="currentTitle">Painel Mestre das Lojas</strong>

        <span id="topbarSub">
          PAINEL MESTRE &bull; PRODUTOR
        </span>
      </div>


      <div
        class="active-store-chip"
        title="Loja atualmente selecionada">

        <span class="active-store-dot"></span>

        <span id="activeStoreName">
          Loja Mestre
        </span>

      </div>

    </header>


    <iframe
      id="appFrame"
      src="lojas_master.html"
      title="Área de trabalho"
      >
    </iframe>

  </main>

</div>


<script src="js/local-store.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/branding.js"></script>


<script>

async function fazerBackup(){

  try{

    const r = await fetch(
      '/api/admin/backup',
      {
        method:'POST',
        credentials:'same-origin'
      }
    );

    const j = await r.json();

    alert(
      j.ok
        ? 'Backup realizado com sucesso!'
        : 'Erro no backup'
    );

  }catch(e){

    alert(
      'Erro ao conectar com servidor'
    );

  }

}


window.listarBackups = async function(){

  try{

    const r = await fetch(
      '/api/admin/backups',
      {
        credentials:'same-origin',
        cache:'no-store'
      }
    );

    const j = await r.json();

    const div =
      document.getElementById(
        'listaBackups'
      );

    div.innerHTML = '';


    if(
      !j.backups ||
      j.backups.length === 0
    ){

      div.textContent =
        'Nenhum backup encontrado';

      return;

    }


    j.backups.forEach(function(arquivo){

      const row =
        document.createElement('div');

      row.className =
        'backup-row';


      const nome =
        document.createElement('span');

      nome.textContent =
        arquivo;


      const btn =
        document.createElement('button');

      btn.type =
        'button';

      btn.textContent =
        'Restaurar';

      btn.addEventListener(
        'click',
        function(){

          restaurar(
            arquivo
          );

        }
      );


      row.appendChild(
        nome
      );

      row.appendChild(
        btn
      );

      div.appendChild(
        row
      );

    });

  }catch(e){

    alert(
      'Erro ao listar backups'
    );

  }

};


window.restaurar =
async function(arquivo){

  if(
    !confirm(
      'Restaurar este backup?'
    )
  ){
    return;
  }


  try{

    const r =
      await fetch(
        '/api/admin/restore',
        {
          method:'POST',
          credentials:'same-origin',
          headers:{
            'Content-Type':
              'application/json'
          },
          body:
            JSON.stringify({
              arquivo:arquivo
            })
        }
      );


    const j =
      await r.json();


    alert(
      j.ok
        ? 'Restaurado com sucesso!'
        : 'Erro ao restaurar'
    );

  }catch(e){

    alert(
      'Erro ao conectar com servidor'
    );

  }

};

</script>


<script src="js/chatbot.js"></script>

</body>
</html>
